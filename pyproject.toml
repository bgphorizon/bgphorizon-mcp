[project]
name = "bgphorizon-mcp"
version = "0.1.0"
description = "MCP server exposing BGPHorizon BGP routing intelligence to any MCP-capable LLM client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BGPHorizon" }]
keywords = ["mcp", "bgp", "routing", "rpki", "irr", "network", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking",
    "Topic :: Internet",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
# Pinned to the mcp 1.x line for its stable, widely-documented FastMCP decorator
# API. 2.0.0 is a just-released major rewrite (removed mcp.server.fastmcp); keeping
# 1.x makes this server easier for others to read, fork, and modify.
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.scripts]
bgphorizon-mcp = "bgphorizon_mcp.__main__:main"

[project.urls]
Homepage = "https://bgphorizon.com"
Documentation = "https://bgphorizon.com/docs/mcp"
Repository = "https://github.com/bgphorizon/bgphorizon-mcp"
Issues = "https://github.com/bgphorizon/bgphorizon-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgphorizon_mcp"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]
