name: Publish to PyPI

# Publishes on a GitHub Release. Uses PyPI Trusted Publishing (OIDC) — no API
# token is stored anywhere. Configure the trusted publisher once on PyPI
# (see PUBLISHING.md), then every published release ships automatically.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run --group dev pytest -q

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always
