name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --group dev
      - name: Test
        run: uv run pytest -q
      - name: Selftest surfaces (no key needed)
        run: uv run python -c "import asyncio; from bgphorizon_mcp.config import load_settings; from bgphorizon_mcp.server import build_server; m=build_server(load_settings()); print('tools', len(asyncio.run(m.list_tools())))"
